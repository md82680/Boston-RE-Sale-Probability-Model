name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_REGION: ${{ secrets.GKE_REGION }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Run backend tests
        run: make test-backend-cov
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
          
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --coverage
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: |
            ./backend/coverage.xml
            ./frontend/coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
          
      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev
          
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: us-east1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/docker-repo/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: us-east1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/docker-repo/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
          
      - name: Install GKE Auth Plugin
        run: |
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
          sudo apt-get update && sudo apt-get install -y google-cloud-sdk-gke-gcloud-auth-plugin
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV
          
      - name: Configure Docker
        run: gcloud auth configure-docker
          
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --region ${{ env.GKE_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}
            
      - name: Deploy to GKE
        run: |
          # Update image tags with the specific SHA
          sed -i "s|us-east1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/docker-repo/backend:latest|us-east1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/docker-repo/backend:${{ github.sha }}|g" k8s/deployment.yaml
          sed -i "s|us-east1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/docker-repo/frontend:latest|us-east1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/docker-repo/frontend:${{ github.sha }}|g" k8s/deployment.yaml
          
          # Apply core Kubernetes manifests
          kubectl apply -f k8s/deployment.yaml
          
          # Try to apply monitoring resources, but don't fail if they don't exist
          if kubectl api-resources | grep -q servicemonitors; then
            echo "Applying monitoring resources..."
            kubectl apply -f k8s/monitoring.yaml || true
          else
            echo "ServiceMonitor CRD not installed. Skipping monitoring configuration."
            echo "To enable monitoring, install Prometheus Operator: https://github.com/prometheus-operator/prometheus-operator"
          fi
          
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/real-estate-predictor 